name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24.19.0 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-12
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            bubblewrap \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo loginctl enable-linger "$USER" || true

      - name: Install dependencies
        run: npm ci

      - name: Linux packaging regressions
        if: runner.os == 'Linux'
        run: bash scripts/test-linux-packaging.sh

      - name: Typecheck and unit tests
        run: |
          npm run lint
          npm run test:server

      - name: Rust gates (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:rust

      - name: Static Themis checker parity
        run: npm run test:themis-parity

      - name: Live Themis Oracle gate (Windows only)
        if: runner.os == 'Windows'
        run: npm run test:themis-oracle

      - name: Build frontend and native sidecar
        run: |
          npm run build:frontend
          npm run build:server

      - name: Check Tauri shell (Linux)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo check --locked
