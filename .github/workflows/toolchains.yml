name: Build and Publish Toolchains

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: judgedesk-toolchains-v2
  cancel-in-progress: false

env:
  TOOLCHAIN_RELEASE_TAG: toolchains-v2
  TOOLCHAIN_MANIFEST_SIGNING_KEY_ID: judgedesk-toolchains-2026-07

jobs:
  bundle-windows:
    name: Package Windows x64 toolchains
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Pin reproducible package timestamp
        shell: pwsh
        run: |
          "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" |
            Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Restore verified upstream source cache
        uses: actions/cache@v4
        with:
          path: build/toolchain-source-cache
          key: toolchain-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/toolchain-release-sources.ts') }}
      - name: Download, verify, smoke-test and package release Windows toolchains
        run: npm run toolchains:package:host -- dist-toolchains
      - name: Prepare isolated Windows gate root
        run: npm run toolchains:prepare:gate -- dist-toolchains build/toolchain-gate-root
      - name: Reproduce installed-resource ACLs in the Windows gate root
        shell: pwsh
        run: ./scripts/prepare-windows-toolchain-gate-acl.ps1 build/toolchain-gate-root
      - name: Build the native secure executor
        run: npm run build:executor
      - name: Gate every Windows compiler and runtime in the secure runner
        shell: pwsh
        env:
          JUDGEDESK_REAL_TOOLCHAIN_GATES: "1"
          JUDGEDESK_REAL_TOOLCHAIN_GATE_ROOT: ${{ github.workspace }}\build\toolchain-gate-root
          JUDGEDESK_REAL_LANGUAGE_GATES: pascal,java,python
        run: |
          npx tsx --test server/judge/c-submission.gate.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsx --test server/judge/multi-language.gate.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsx --test server/judge/custom-checker.gate.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: toolchains-windows-x64
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: dist-toolchains/*

  bundle-macos-arm64:
    name: Package macOS Apple Silicon toolchains
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Require an Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - name: Pin reproducible package timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Restore verified upstream source cache
        uses: actions/cache@v4
        with:
          path: build/toolchain-source-cache
          key: toolchain-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/toolchain-release-sources.ts') }}
      - name: Download, verify, smoke-test and package release Apple Silicon toolchains
        run: npm run toolchains:package:host -- dist-toolchains
      - name: Prepare isolated Apple Silicon gate root
        run: npm run toolchains:prepare:gate -- dist-toolchains build/toolchain-gate-root
      - name: Build the native secure executor
        run: npm run build:executor
      - name: Gate every Apple Silicon compiler and runtime in the secure runner
        env:
          JUDGEDESK_REAL_TOOLCHAIN_GATES: "1"
          JUDGEDESK_REAL_TOOLCHAIN_GATE_ROOT: ${{ github.workspace }}/build/toolchain-gate-root
          JUDGEDESK_REAL_LANGUAGE_GATES: pascal,java,python
        run: |
          npx tsx --test server/judge/c-submission.gate.test.ts
          npx tsx --test server/judge/multi-language.gate.test.ts
          npx tsx --test server/judge/custom-checker.gate.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: toolchains-macos-arm64
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: dist-toolchains/*

  publish:
    needs: [bundle-windows, bundle-macos-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pin reproducible manifest timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist-toolchains
          merge-multiple: true
      - name: Generate signed strict manifest and checksums
        env:
          TOOLCHAIN_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.TOOLCHAIN_RELEASE_TAG }}
          TOOLCHAIN_MANIFEST_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TOOLCHAIN_MANIFEST_SIGNING_PRIVATE_KEY_B64 }}
        run: npm run toolchains:manifest -- dist-toolchains
      - name: Create or update toolchain release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TOOLCHAIN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TOOLCHAIN_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "JudgeDesk managed toolchains v2" \
              --notes "Signed compiler/runtime packages for JudgeDesk Full and Core on Windows x64 and macOS Apple Silicon." \
              --latest=false
          fi
          gh release upload "$TOOLCHAIN_RELEASE_TAG" dist-toolchains/* \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
