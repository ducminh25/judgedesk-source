name: Verify Release Source

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-12
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            bubblewrap \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo loginctl enable-linger "$USER" || true
      - run: npm ci --no-audit --no-fund
      - name: Verify version, types, tests, builds and Rust formatting
        run: |
          npm run release:check-version
          npm run lint
          npm run test:update-ui
          npm run test:server
          npm run build:frontend
          npm run build:server
          cargo build --locked --manifest-path native-executor/Cargo.toml
          npm run test:executor
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo fmt --check --manifest-path native-executor/Cargo.toml
          cargo fmt --check --manifest-path crates/judgedesk-core/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path crates/judgedesk-core/Cargo.toml

# Final installers are intentionally assembled outside this workflow:
# - Windows Core/Full are built on the validated Windows host and updater-signed
#   by the CodeMagic windows-updater-signing workflow.
# - macOS Apple Silicon Core/Full are built by CodeMagic macos-arm64-release.
# - Linux x86_64 (.deb, .rpm, .AppImage) are built on the validated Ubuntu host
#   and updater-signed by the CodeMagic windows-updater-signing workflow.
# - The verified artifacts are uploaded to the public ducminh25/judgedesk repo.
