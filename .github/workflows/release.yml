name: Verify Release Source

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci --no-audit --no-fund
      - name: Verify version, types, tests, builds and Rust formatting
        run: |
          npm run release:check-version
          npm run lint
          npm run test:update-ui
          npm run test:server
          npm run build:frontend
          npm run build:server
          npm run test:executor
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo fmt --check --manifest-path native-executor/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml

# Final installers are intentionally assembled outside this workflow:
# - Windows Core/Full are built on the validated Windows host and updater-signed
#   by the CodeMagic windows-updater-signing workflow.
# - macOS Apple Silicon Core/Full are built by CodeMagic macos-arm64-release.
# - The verified artifacts are uploaded to the public ducminh25/judgedesk repo.
