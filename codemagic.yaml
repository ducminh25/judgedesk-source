workflows:
  macos-arm64-release:
    name: JudgeDesk Apple Silicon release
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - themis_signing
      vars:
        MACOSX_DEPLOYMENT_TARGET: "11.0"
      node: 22.23.1
      xcode: latest
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - native-executor/target
        - src-tauri/target
    scripts:
      - name: Fail fast on missing release credentials
        script: |
          set -euo pipefail
          required=(
            TAURI_SIGNING_PRIVATE_KEY
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing $variable in the themis_signing variable group." >&2
              exit 1
            fi
          done
      - name: Install Rust toolchain
        script: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup default stable
          rustup component add rustfmt
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$CM_ENV"
      - name: Record deterministic build provenance
        script: |
          set -euo pipefail
          source_epoch="$(git show -s --format=%ct "${CM_COMMIT:-HEAD}")"
          {
            echo "JUDGEDESK_GIT_COMMIT=${CM_COMMIT:-unknown}"
            echo "JUDGEDESK_BUILD_NUMBER=${BUILD_NUMBER:-unknown}"
            echo "SOURCE_DATE_EPOCH=$source_epoch"
          } >> "$CM_ENV"
      - name: Install and verify source
        script: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run release:check-version
          npm run lint
          npm run test:update-ui
          npm run test:server
          npm run build:frontend
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo fmt --check --manifest-path native-executor/Cargo.toml
      - name: Install the Apple Silicon Rust target
        script: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
      - name: Build and smoke-test the Apple Silicon sidecar
        script: |
          set -euo pipefail
          bash scripts/build-macos-arm64-sidecar.sh
      - name: Test the Tauri shell with staged Apple Silicon sidecars
        script: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Prepare Core distribution resources
        script: |
          set -euo pipefail
          npm run distribution:sync:core
      - name: Build Apple Silicon Core app and DMG
        script: |
          set -euo pipefail
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          rm -rf src-tauri/target/aarch64-apple-darwin/release/bundle
          npx tauri build \
            --config src-tauri/tauri.macos.core.conf.json \
            --target aarch64-apple-darwin
      - name: Verify and stage macOS Core artifact
        script: |
          set -euo pipefail
          rm -rf release-assets-mac
          JUDGEDESK_DISTRIBUTION_VARIANT=core bash scripts/verify-macos-arm64-bundle.sh
      - name: Prepare Full distribution resources
        script: |
          set -euo pipefail
          npm run distribution:sync:full
      - name: Build Apple Silicon Full app, DMG, and updater bundle
        script: |
          set -euo pipefail
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          rm -rf src-tauri/target/aarch64-apple-darwin/release/bundle
          npx tauri build \
            --config src-tauri/tauri.macos.full.conf.json \
            --target aarch64-apple-darwin
      - name: Verify and stage macOS Full artifacts
        script: |
          set -euo pipefail
          JUDGEDESK_DISTRIBUTION_VARIANT=full bash scripts/verify-macos-arm64-bundle.sh
          cat release-assets-mac/SHA256SUMS-macos
      - name: Gate every bundled submission language in the packaged secure runner
        script: |
          set -euo pipefail
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/JudgeDesk.app"
          resources="$app/Contents/Resources"
          test -x "$app/Contents/MacOS/judgedesk-executor"
          test -d "$resources/toolchains"
          export THEMIS_RESOURCE_DIR="$resources"
          export JUDGEDESK_EXECUTOR_PATH="$app/Contents/MacOS/judgedesk-executor"
          export JUDGEDESK_REAL_TOOLCHAIN_GATES=1
          export JUDGEDESK_REAL_TOOLCHAIN_GATE_ROOT="$resources/toolchains"
          export JUDGEDESK_REAL_TOOLCHAIN_GATE_ORIGIN=built-in
          export JUDGEDESK_REAL_LANGUAGE_GATES=pascal,java,python
          npx tsx --test server/judge/c-submission.gate.test.ts
          npx tsx --test server/judge/multi-language.gate.test.ts
          npx tsx --test server/judge/custom-checker.gate.test.ts
      - name: Gate packaged custom checkers, cancellation, and process supervision
        script: |
          set -euo pipefail
          npm run test:macos-packaged-checkers
          npm run test:macos-process-supervisor
    artifacts:
      - release-assets-mac/JudgeDesk_*_core_aarch64.dmg
      - release-assets-mac/JudgeDesk_*_full_aarch64.dmg
      - release-assets-mac/JudgeDesk_*_full_aarch64.app.tar.gz
      - release-assets-mac/JudgeDesk_*_full_aarch64.app.tar.gz.sig
      - release-assets-mac/SHA256SUMS-macos

  windows-updater-signing:
    name: JudgeDesk Windows updater signing
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups:
        - themis_signing
      node: 22.23.1
    scripts:
      - name: Install source dependencies
        script: npm ci --no-audit --no-fund
      - name: Download and sign the staged Windows MSI
        script: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "Missing required signing input: TAURI_SIGNING_PRIVATE_KEY" >&2
            exit 1
          fi
          if [[ -z "${WINDOWS_CORE_MSI_SHA256:-}" ]]; then
            echo "Missing required signing input: WINDOWS_CORE_MSI_SHA256" >&2
            exit 1
          fi
          if [[ -z "${WINDOWS_FULL_MSI_SHA256:-}" ]]; then
            echo "Missing required signing input: WINDOWS_FULL_MSI_SHA256" >&2
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          staging_tag="v${version}-staging"
          mkdir -p release-assets-windows
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          for variant in core full; do
            msi_name="JudgeDesk_${version}_${variant}_x64_en-US.msi"
            staging_url="https://github.com/ducminh25/judgedesk/releases/download/${staging_tag}/${msi_name}"
            curl --proto '=https' --tlsv1.2 -fL "$staging_url" -o "release-assets-windows/$msi_name"
            case "$variant" in
              core) expected="$WINDOWS_CORE_MSI_SHA256" ;;
              full) expected="$WINDOWS_FULL_MSI_SHA256" ;;
            esac
            expected="$(printf '%s' "$expected" | tr '[:upper:]' '[:lower:]')"
            if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid expected SHA-256 for $msi_name." >&2
              exit 1
            fi
            actual="$(shasum -a 256 "release-assets-windows/$msi_name" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "Staged MSI SHA-256 mismatch for $msi_name." >&2
              exit 1
            fi
          done
          for variant in core full; do
            msi_name="JudgeDesk_${version}_${variant}_x64_en-US.msi"
            npx tauri signer sign "release-assets-windows/$msi_name"
            test -s "release-assets-windows/$msi_name.sig"
          done
          (
            cd release-assets-windows
            shasum -a 256 JudgeDesk_*.msi > SHA256SUMS-windows
            cat SHA256SUMS-windows
          )
    artifacts:
      - release-assets-windows/JudgeDesk_*.msi
      - release-assets-windows/JudgeDesk_*.msi.sig
      - release-assets-windows/SHA256SUMS-windows
