workflows:
  macos-arm64-release:
    name: JudgeDesk Apple Silicon release
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - themis_signing
      vars:
        MACOSX_DEPLOYMENT_TARGET: "11.0"
      node: 22.23.1
      xcode: latest
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - native-executor/target
        - src-tauri/target
    scripts:
      - name: Fail fast on missing release credentials
        script: |
          set -euo pipefail
          required=(
            TAURI_SIGNING_PRIVATE_KEY
            MACOS_DEVELOPER_ID_P12_BASE64
            APPLE_API_ISSUER
            APPLE_API_KEY
            APPLE_API_PRIVATE_KEY_BASE64
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing $variable in the themis_signing variable group." >&2
              exit 1
            fi
          done
      - name: Install Rust toolchain
        script: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup default stable
          rustup component add rustfmt
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$CM_ENV"
      - name: Import Developer ID and configure notarization
        script: |
          set -euo pipefail
          certificate="$CM_TEMPORARY_FOLDER/developer-id-application.p12"
          api_key="$CM_TEMPORARY_FOLDER/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D > "$certificate"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$api_key"
          chmod 600 "$certificate" "$api_key"
          keychain initialize
          keychain add-certificates \
            --certificate "$certificate" \
            --certificate-password "${MACOS_DEVELOPER_ID_PASSWORD:-}"
          identity="$(
            security find-identity -v -p codesigning \
              | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
              | head -n 1
          )"
          if [[ -z "$identity" ]]; then
            echo "A valid Developer ID Application identity was not imported." >&2
            exit 1
          fi
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "APPLE_API_KEY_PATH=$api_key"
            echo "JUDGEDESK_REQUIRE_NOTARIZATION=1"
          } >> "$CM_ENV"
          security find-identity -v -p codesigning
      - name: Record deterministic build provenance
        script: |
          set -euo pipefail
          source_epoch="$(git show -s --format=%ct "${CM_COMMIT:-HEAD}")"
          {
            echo "JUDGEDESK_GIT_COMMIT=${CM_COMMIT:-unknown}"
            echo "JUDGEDESK_BUILD_NUMBER=${BUILD_NUMBER:-unknown}"
            echo "SOURCE_DATE_EPOCH=$source_epoch"
          } >> "$CM_ENV"
      - name: Install and verify source
        script: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run release:check-version
          npm run lint
          npm run test:server
          npm run build:frontend
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo fmt --check --manifest-path native-executor/Cargo.toml
      - name: Install the Apple Silicon Rust target
        script: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
      - name: Build and smoke-test the Apple Silicon sidecar
        script: |
          set -euo pipefail
          bash scripts/build-macos-arm64-sidecar.sh
      - name: Build Apple Silicon app, DMG, and updater bundle
        script: |
          set -euo pipefail
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          npx tauri build \
            --config src-tauri/tauri.macos.conf.json \
            --target aarch64-apple-darwin
      - name: Verify and stage macOS release artifacts
        script: |
          set -euo pipefail
          bash scripts/verify-macos-arm64-bundle.sh
    artifacts:
      - release-assets-mac/JudgeDesk_*.dmg
      - release-assets-mac/JudgeDesk.app.tar.gz
      - release-assets-mac/JudgeDesk.app.tar.gz.sig
      - release-assets-mac/SHA256SUMS-macos

  windows-x64-release:
    name: JudgeDesk Windows x64 release
    instance_type: windows_x2
    max_build_duration: 120
    environment:
      groups:
        - themis_signing
      node: 22.23.1
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - src-tauri/target
    scripts:
      - name: Install Rust toolchain
        script: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
          & .\rustup-init.exe -y --profile minimal --default-toolchain stable --default-host x86_64-pc-windows-msvc
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          rustup component add rustfmt
      - name: Install and verify source
        script: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          npm ci --no-audit --no-fund
          npm run release:check-version
          npm run lint
          npm run test:server
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Require the updater signing key
        script: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Add TAURI_SIGNING_PRIVATE_KEY to the themis_signing variable group.'
          }
      - name: Build Windows x64 sidecar, MSI, and updater bundle
        script: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          $env:TAURI_TARGET = 'x86_64-pc-windows-msvc'
          if ($null -eq $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ''
          }
          npm run build:server
          npx tauri build --config src-tauri/tauri.windows.conf.json --target x86_64-pc-windows-msvc
      - name: Verify and stage Windows release artifacts
        script: |
          $ErrorActionPreference = 'Stop'
          $bundleDirectory = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi'
          $msi = Get-ChildItem "$bundleDirectory/JudgeDesk_*.msi" | Select-Object -First 1
          if (-not $msi) { throw 'MSI output was not created.' }
          $signaturePath = "$($msi.FullName).sig"
          if (-not (Test-Path $signaturePath)) { throw 'Signed MSI updater artifact was not created.' }
          $authenticode = Get-AuthenticodeSignature $msi.FullName
          $authenticode | Format-List Status,StatusMessage,SignerCertificate
          New-Item -ItemType Directory -Force release-assets-windows | Out-Null
          Copy-Item $msi.FullName release-assets-windows/
          Copy-Item $signaturePath release-assets-windows/
          Get-ChildItem release-assets-windows -File |
            Where-Object { $_.Extension -ne '.sig' } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content release-assets-windows/SHA256SUMS-windows -Encoding ascii
          Get-Content release-assets-windows/SHA256SUMS-windows
    artifacts:
      - release-assets-windows/JudgeDesk_*.msi
      - release-assets-windows/JudgeDesk_*.msi.sig
      - release-assets-windows/SHA256SUMS-windows

  windows-updater-signing:
    name: JudgeDesk Windows updater signing
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups:
        - themis_signing
      node: 22.23.1
    scripts:
      - name: Install source dependencies
        script: npm ci --no-audit --no-fund
      - name: Download and sign the staged Windows MSI
        script: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "Add TAURI_SIGNING_PRIVATE_KEY to the themis_signing variable group." >&2
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          msi_name="JudgeDesk_${version}_x64_en-US.msi"
          staging_tag="v${version}-staging"
          staging_url="https://github.com/ducminh25/themis-v2/releases/download/${staging_tag}/${msi_name}"
          mkdir -p release-assets-windows
          curl --proto '=https' --tlsv1.2 -fL "$staging_url" -o "release-assets-windows/$msi_name"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          npx tauri signer sign "release-assets-windows/$msi_name"
          test -s "release-assets-windows/$msi_name.sig"
          (
            cd release-assets-windows
            shasum -a 256 "$msi_name" > SHA256SUMS-windows
            cat SHA256SUMS-windows
          )
    artifacts:
      - release-assets-windows/JudgeDesk_*.msi
      - release-assets-windows/JudgeDesk_*.msi.sig
      - release-assets-windows/SHA256SUMS-windows
