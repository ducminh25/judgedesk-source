workflows:
  macos-arm64-release:
    name: JudgeDesk Apple Silicon release
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - themis_signing
      vars:
        MACOSX_DEPLOYMENT_TARGET: "11.0"
      node: 24.19.0
      npm: 11.17.0
      xcode: "26.3"
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - native-executor/target
        - src-tauri/target
    scripts:
      - name: Fail fast on missing release credentials
        script: |
          set -euo pipefail
          required=(
            TAURI_SIGNING_PRIVATE_KEY
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing $variable in the themis_signing variable group." >&2
              exit 1
            fi
          done
      - name: Install Rust toolchain
        script: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          source "$HOME/.cargo/env"
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
          rustup default 1.97.1
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$CM_ENV"
      - name: Record deterministic build provenance
        script: |
          set -euo pipefail
          xcodebuild -version
          selected_compiler="$(xcrun --find clang++)"
          printf 'Selected Apple Clang: %s\n' "$selected_compiler"
          "$selected_compiler" --version
          source_epoch="$(git show -s --format=%ct "${CM_COMMIT:-HEAD}")"
          {
            echo "JUDGEDESK_APP_VERSION=$(node -p "require('./package.json').version")"
            echo "JUDGEDESK_GIT_COMMIT=$(git rev-parse HEAD)"
            echo "JUDGEDESK_BUILD_SOURCE_STATE=$(if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then echo dirty; else echo clean; fi)"
            echo "JUDGEDESK_BUILD_NUMBER=${BUILD_NUMBER:?Missing CodeMagic build number}"
            echo "SOURCE_DATE_EPOCH=$source_epoch"
          } >> "$CM_ENV"
      - name: Install and verify source
        script: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run release:check-version
          npm run lint
          npm run test:update-ui
          npm run test:server
          npm run build:frontend
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo fmt --check --manifest-path native-executor/Cargo.toml
      - name: Install the Apple Silicon Rust target
        script: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
      - name: Build and smoke-test the Apple Silicon sidecar
        script: |
          set -euo pipefail
          echo "JUDGEDESK_BUILD_MODE=packaged" >> "$CM_ENV"
          export JUDGEDESK_BUILD_MODE=packaged
          bash scripts/build-macos-arm64-sidecar.sh
      - name: Test the Tauri shell with staged Apple Silicon sidecars
        script: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Prepare Core distribution resources
        script: |
          set -euo pipefail
          npm run distribution:sync:core
      - name: Build Apple Silicon Core app and DMG
        script: |
          set -euo pipefail
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          rm -rf src-tauri/target/aarch64-apple-darwin/release/bundle
          npx tauri build \
            --config src-tauri/tauri.macos.core.conf.json \
            --target aarch64-apple-darwin -- --locked
      - name: Verify and stage macOS Core artifact
        script: |
          set -euo pipefail
          rm -rf release-assets-mac
          JUDGEDESK_DISTRIBUTION_VARIANT=core bash scripts/verify-macos-arm64-bundle.sh
      - name: Prepare Full distribution resources
        script: |
          set -euo pipefail
          npm run distribution:sync:full
      - name: Build Apple Silicon Full app, DMG, and updater bundle
        script: |
          set -euo pipefail
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          rm -rf src-tauri/target/aarch64-apple-darwin/release/bundle
          npx tauri build \
            --config src-tauri/tauri.macos.full.conf.json \
            --target aarch64-apple-darwin -- --locked
      - name: Verify and stage macOS Full artifacts
        script: |
          set -euo pipefail
          JUDGEDESK_DISTRIBUTION_VARIANT=full bash scripts/verify-macos-arm64-bundle.sh
          cat release-assets-mac/SHA256SUMS-macos
      - name: Gate every bundled submission language in the packaged secure runner
        script: |
          set -euo pipefail
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/JudgeDesk.app"
          resources="$app/Contents/Resources"
          test -x "$app/Contents/MacOS/judgedesk-executor"
          test -d "$resources/toolchains"
          export THEMIS_RESOURCE_DIR="$resources"
          export JUDGEDESK_EXECUTOR_PATH="$app/Contents/MacOS/judgedesk-executor"
          export JUDGEDESK_REAL_TOOLCHAIN_GATES=1
          export JUDGEDESK_REAL_TOOLCHAIN_GATE_ROOT="$resources/toolchains"
          export JUDGEDESK_REAL_TOOLCHAIN_GATE_ORIGIN=built-in
          export JUDGEDESK_REAL_LANGUAGE_GATES=pascal,java,python,scratch
          npx tsx --test server/judge/c-submission.gate.test.ts
          npx tsx --test server/judge/multi-language.gate.test.ts
          npx tsx --test server/judge/custom-checker.gate.test.ts
      - name: Gate packaged custom checkers, cancellation, and process supervision
        script: |
          set -euo pipefail
          npm run test:macos-packaged-checkers
          npm run test:macos-process-supervisor
    artifacts:
      - release-assets-mac/JudgeDesk_*_core_aarch64.dmg
      - release-assets-mac/JudgeDesk_*_core_aarch64.app.tar.gz
      - release-assets-mac/JudgeDesk_*_core_aarch64.app.tar.gz.sig
      - release-assets-mac/JudgeDesk_*_core_aarch64.app.tar.gz.metadata.json
      - release-assets-mac/JudgeDesk_*_full_aarch64.dmg
      - release-assets-mac/JudgeDesk_*_full_aarch64.app.tar.gz
      - release-assets-mac/JudgeDesk_*_full_aarch64.app.tar.gz.sig
      - release-assets-mac/JudgeDesk_*_full_aarch64.app.tar.gz.metadata.json
      - release-assets-mac/SHA256SUMS-macos

  windows-updater-signing:
    name: JudgeDesk Windows updater signing
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups:
        - themis_signing
      node: 24.19.0
      npm: 11.17.0
    scripts:
      - name: Install source dependencies
        script: npm ci --no-audit --no-fund
      - name: Download and sign the staged Windows MSI
        script: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "Missing required signing input: TAURI_SIGNING_PRIVATE_KEY" >&2
            exit 1
          fi
          if [[ -z "${WINDOWS_CORE_MSI_SHA256:-}" ]]; then
            echo "Missing required signing input: WINDOWS_CORE_MSI_SHA256" >&2
            exit 1
          fi
          if [[ -z "${WINDOWS_FULL_MSI_SHA256:-}" ]]; then
            echo "Missing required signing input: WINDOWS_FULL_MSI_SHA256" >&2
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          staging_tag="v${version}-staging"
          mkdir -p release-assets-windows
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          for variant in core full; do
            msi_name="JudgeDesk_${version}_${variant}_x64_en-US.msi"
            staging_url="https://github.com/ducminh25/judgedesk/releases/download/${staging_tag}/${msi_name}"
            curl --proto '=https' --tlsv1.2 -fL "$staging_url" -o "release-assets-windows/$msi_name"
            metadata_name="${msi_name}.metadata.json"
            metadata_url="https://github.com/ducminh25/judgedesk/releases/download/${staging_tag}/${metadata_name}"
            curl --proto '=https' --tlsv1.2 -fL "$metadata_url" -o "release-assets-windows/$metadata_name"
            case "$variant" in
              core) expected="$WINDOWS_CORE_MSI_SHA256" ;;
              full) expected="$WINDOWS_FULL_MSI_SHA256" ;;
            esac
            expected="$(printf '%s' "$expected" | tr '[:upper:]' '[:lower:]')"
            if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid expected SHA-256 for $msi_name." >&2
              exit 1
            fi
            actual="$(shasum -a 256 "release-assets-windows/$msi_name" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "Staged MSI SHA-256 mismatch for $msi_name." >&2
              exit 1
            fi
          done
          linux_bundles=()
          if [[ -n "${LINUX_DEB_SHA256:-}" || -n "${LINUX_RPM_SHA256:-}" || -n "${LINUX_APPIMAGE_SHA256:-}" ]]; then
            mkdir -p release-assets-linux
            for spec in \
              "JudgeDesk_${version}_amd64.deb:${LINUX_DEB_SHA256:-}" \
              "JudgeDesk-${version}-1.x86_64.rpm:${LINUX_RPM_SHA256:-}" \
              "JudgeDesk_${version}_amd64.AppImage:${LINUX_APPIMAGE_SHA256:-}"; do
              pkg_name="${spec%%:*}"
              expected_pkg="${spec#*:}"
              if [[ -z "$expected_pkg" ]]; then
                echo "Missing expected SHA-256 for $pkg_name." >&2
                exit 1
              fi
              expected_pkg="$(printf '%s' "$expected_pkg" | tr '[:upper:]' '[:lower:]')"
              if ! [[ "$expected_pkg" =~ ^[0-9a-f]{64}$ ]]; then
                echo "Invalid expected SHA-256 for $pkg_name." >&2
                exit 1
              fi
              pkg_url="https://github.com/ducminh25/judgedesk/releases/download/${staging_tag}/${pkg_name}"
              curl --proto '=https' --tlsv1.2 -fL "$pkg_url" -o "release-assets-linux/$pkg_name"
              meta_name="${pkg_name}.metadata.json"
              meta_url="https://github.com/ducminh25/judgedesk/releases/download/${staging_tag}/${meta_name}"
              curl --proto '=https' --tlsv1.2 -fL "$meta_url" -o "release-assets-linux/$meta_name"
              actual_pkg="$(shasum -a 256 "release-assets-linux/$pkg_name" | awk '{print $1}')"
              if [[ "$actual_pkg" != "$expected_pkg" ]]; then
                echo "Staged Linux package SHA-256 mismatch for $pkg_name." >&2
                exit 1
              fi
              linux_bundles+=("release-assets-linux/$pkg_name")
            done
          fi
          if [[ -n "${LINUX_FULL_DEB_SHA256:-}" || -n "${LINUX_FULL_RPM_SHA256:-}" || -n "${LINUX_FULL_APPIMAGE_SHA256:-}" ]]; then
            mkdir -p release-assets-linux
            for spec in \
              "JudgeDesk_${version}_full_amd64.deb:${LINUX_FULL_DEB_SHA256:-}" \
              "JudgeDesk-${version}-full-1.x86_64.rpm:${LINUX_FULL_RPM_SHA256:-}" \
              "JudgeDesk_${version}_full_amd64.AppImage:${LINUX_FULL_APPIMAGE_SHA256:-}"; do
              pkg_name="${spec%%:*}"
              expected_pkg="${spec#*:}"
              if [[ -z "$expected_pkg" ]]; then
                echo "Missing expected SHA-256 for $pkg_name." >&2
                exit 1
              fi
              expected_pkg="$(printf '%s' "$expected_pkg" | tr '[:upper:]' '[:lower:]')"
              if ! [[ "$expected_pkg" =~ ^[0-9a-f]{64}$ ]]; then
                echo "Invalid expected SHA-256 for $pkg_name." >&2
                exit 1
              fi
              pkg_url="https://github.com/ducminh25/judgedesk/releases/download/${staging_tag}/${pkg_name}"
              curl --proto '=https' --tlsv1.2 -fL "$pkg_url" -o "release-assets-linux/$pkg_name"
              meta_name="${pkg_name}.metadata.json"
              meta_url="https://github.com/ducminh25/judgedesk/releases/download/${staging_tag}/${meta_name}"
              curl --proto '=https' --tlsv1.2 -fL "$meta_url" -o "release-assets-linux/$meta_name"
              actual_pkg="$(shasum -a 256 "release-assets-linux/$pkg_name" | awk '{print $1}')"
              if [[ "$actual_pkg" != "$expected_pkg" ]]; then
                echo "Staged Linux package SHA-256 mismatch for $pkg_name." >&2
                exit 1
              fi
              linux_bundles+=("release-assets-linux/$pkg_name")
            done
          fi
          for variant in core full; do
            msi_name="JudgeDesk_${version}_${variant}_x64_en-US.msi"
            npx tauri signer sign "release-assets-windows/$msi_name"
            test -s "release-assets-windows/$msi_name.sig"
          done
          for linux_pkg in "${linux_bundles[@]:-}"; do
            if [[ -n "$linux_pkg" ]]; then
              npx tauri signer sign "$linux_pkg"
              test -s "${linux_pkg}.sig"
            fi
          done
          (
            cd release-assets-windows
            shasum -a 256 JudgeDesk_*.msi > SHA256SUMS-windows
            cat SHA256SUMS-windows
          )
          if [[ -d release-assets-linux ]]; then
            (
              cd release-assets-linux
              shasum -a 256 JudgeDesk_*.deb JudgeDesk-*.rpm JudgeDesk_*.AppImage > SHA256SUMS-linux
              cat SHA256SUMS-linux
            )
          fi
    artifacts:
      - release-assets-windows/JudgeDesk_*.msi
      - release-assets-windows/JudgeDesk_*.msi.sig
      - release-assets-windows/JudgeDesk_*.msi.metadata.json
      - release-assets-windows/SHA256SUMS-windows
      - release-assets-linux/JudgeDesk_*.deb
      - release-assets-linux/JudgeDesk_*.deb.sig
      - release-assets-linux/JudgeDesk_*.deb.metadata.json
      - release-assets-linux/JudgeDesk-*.rpm
      - release-assets-linux/JudgeDesk-*.rpm.sig
      - release-assets-linux/JudgeDesk-*.rpm.metadata.json
      - release-assets-linux/JudgeDesk_*.AppImage
      - release-assets-linux/JudgeDesk_*.AppImage.sig
      - release-assets-linux/JudgeDesk_*.AppImage.metadata.json
      - release-assets-linux/SHA256SUMS-linux
