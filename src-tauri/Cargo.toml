[package]
name = "themis-v2"
version = "1.6.1"
description = "ThemisV2 - Local Online Judge"
authors = ["Mon"]
edition = "2021"

[lib]
name = "themis_v2_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
dirs = "=6.0.0"
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
getrandom = "=0.3.4"
rfd = { version = "=0.16.0", default-features = false, features = ["common-controls-v6"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# Preserve Node/JSON Schema number semantics at announcement safe-integer boundaries.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "=1.0.228", features = ["derive"] }
ring = "=0.17.14"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
walkdir = "2"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
judgedesk-core = { path = "../crates/judgedesk-core" }
judgedesk-native-executor = { path = "../native-executor" }
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "=0.2.186"
